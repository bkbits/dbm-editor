# 将演示应用自动发布到 GitHub Pages
# 参考官方静态站点部署模板（两段式 build + deploy），构建步骤换成本项目工具链：
# bun install + vite-plus（vp）应用模式构建（vite.pages.config.ts，base './' 相对路径，
# 产物可托管于项目页子路径 /<仓库名>/）；Jekyll 模板不适用（本站为 Vite 构建的 SPA，非 Jekyll 站点）。
name: 发布演示应用到 GitHub Pages

on:
  # 推送到 devel 分支时自动发布（当前开发主线；main 落后较多，暂不纳入触发）
  push:
    branches: ["devel"]
  # 支持在 Actions 页面手动触发
  workflow_dispatch:

# 授予 GITHUB_TOKEN 部署 GitHub Pages 所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间仅保留一个部署，排队等待而不取消进行中的部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 构建作业：检出 → 安装 bun → 安装依赖 → 应用模式构建 → 上传产物
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # 与本地验证一致的版本（package.json devEngines 亦声明 bun）
          bun-version: "1.3.14"
      - name: 安装依赖
        run: bun install --frozen-lockfile
      - name: 构建演示应用（应用模式，相对路径 base）
        run: bun run build:pages
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 仅上传构建产物（dist：index.html + assets + favicon；动作会自动附带 .nojekyll）
          path: "dist"

  # 部署作业（与官方模板一致）
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
